<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Management Interface</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Data Management Interface</h1>
        
        <div class="card">
            <div class="card-body">
                <div class="row mb-4">
                    <div class="col-md-6">
                        <input type="file" id="csvFile" accept=".csv" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <button id="uploadBtn" class="btn btn-primary w-100">Upload CSV</button>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-3">
                        <button id="displayBtn" class="btn btn-info w-100">Display Data</button>
                    </div>
                    <div class="col-md-3">
                        <div class="mb-2">
                            <input type="email" id="senderEmail" class="form-control" placeholder="Sender Email">
                        </div>
                        <div class="mb-2">
                            <input type="email" id="receiverEmail" class="form-control" placeholder="Receiver Email">
                        </div>
                        <button id="emailBtn" class="btn btn-success w-100">Send Email</button>
                    </div>
                    <div class="col-md-3">
                        <div class="mb-2">
                            <input type="date" id="filterDate" class="form-control">
                        </div>
                        <div class="mb-2">
                            <input type="text" id="filterRestaurant" class="form-control" placeholder="Filter by Restaurant Name">
                        </div>
                        <button id="downloadBtn" class="btn btn-warning w-100">Download Data</button>
                    </div>
                    <div class="col-md-3">
                        <div class="mb-2">
                            <input type="date" id="deleteFilterDate" class="form-control">
                        </div>
                        <div class="mb-2">
                            <input type="text" id="deleteFilterRestaurant" class="form-control" placeholder="Filter by Restaurant Name">
                        </div>
                        <button id="deleteBtn" class="btn btn-danger w-100">Delete Data</button>
                    </div>
                </div>

                <div id="dataDisplay" class="table-responsive">
                    <!-- Data will be displayed here -->
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
